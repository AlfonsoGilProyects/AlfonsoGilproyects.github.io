display:flex;flex-direction:column;gap:14px;max-width:640px\">\n<p style=\"margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#f2b15c\">Un día en los lagos<\u002Fp>\n<h2 class=\"serif\" style=\"margin:0;font-size:clamp(32px,4.6vw,56px);line-height:1.05;font-weight:500\">Tres cosas que no vamos a perdernos<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:24px\">\n<div class=\"rv card\" style=\"flex:1 1 300px;display:flex;flex-direction:column;gap:16px;padding:32px;border-radius:20px;background:#12302c;border:1px solid #1f4a44\">\n<svg width=\"44\" height=\"44\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f2b15c\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 18h18\"><\u002Fpath><path d=\"M6 18a6 6 0 0 1 12 0\"><\u002Fpath><path d=\"M12 4v3\"><\u002Fpath><path d=\"M4.5 9l2 2\"><\u002Fpath><path d=\"M19.5 9l-2 2\"><\u002Fpath><\u002Fsvg>\n<h3 class=\"serif\" style=\"margin:0;font-size:26px;font-weight:500\">Amanecer en el Enol<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.6;color:#a9c2ba\">Madrugar un poco, café caliente y ver cómo la luz va bajando por la montaña hasta tocar el agua.<\u002Fp>\n<\u002Fdiv>\n<div class=\"rv card\" style=\"flex:1 1 300px;display:flex;flex-direction:column;gap:16px;padding:32px;border-radius:20px;background:#12302c;border:1px solid #1f4a44\">\n<svg width=\"44\" height=\"44\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f2b15c\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"5\" cy=\"19\" r=\"2\"><\u002Fcircle><circle cx=\"19\" cy=\"5\" r=\"2\"><\u002Fcircle><path d=\"M7 19h6a4 4 0 0 0 0-8h-2a4 4 0 0 1 0-8h6\"><\u002Fpath><\u002Fsvg>\n<h3 class=\"serif\" style=\"margin:0;font-size:26px;font-weight:500\">Paseo del Enol al Ercina<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.6;color:#a9c2ba\">Una caminata tranquila de lago a lago, con paradas para fotos, vacas y mucho silencio.<\u002Fp>\n<\u002Fdiv>\n<div class=\"rv card\" style=\"flex:1 1 300px;display:flex;flex-direction:column;gap:16px;padding:32px;border-radius:20px;background:#12302c;border:1px solid #1f4a44\">\n<svg width=\"44\" height=\"44\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f2b15c\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 21V11a8 8 0 0 1 16 0v10\"><\u002Fpath><path d=\"M9 21v-6a3 3 0 0 1 6 0v6\"><\u002Fpath><path d=\"M12 3V1\"><\u002Fpath><\u002Fsvg>\n<h3 class=\"serif\" style=\"margin:0;font-size:26px;font-weight:500\">Santa Cueva y Basílica<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.6;color:#a9c2ba\">Bajamos a Covadonga para ver la Santa Cueva colgada en la roca y la Basílica entre los árboles.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:90px 24px;background:#0e2421\">\n<div style=\"max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:44px\">\n<div class=\"rv\" style=\"display:flex;flex-direction:column;gap:14px;max-width:640px\">\n<p style=\"margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#f2b15c\">El plan secreto<\u002Fp>\n<h2 class=\"serif\" style=\"margin:0;font-size:clamp(32px,4.6vw,56px);line-height:1.05;font-weight:500\">Cuatro días, cero prisas<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:24px\">\n<div class=\"rv card\" style=\"flex:1 1 240px;display:flex;flex-direction:column;gap:12px;padding:28px;border-radius:20px;background:#12302c;border:1px solid #1f4a44\">\n<div class=\"serif\" style=\"font-size:64px;line-height:1;font-weight:700;color:#f2b15c\">01<\u002Fdiv>\n<h3 style=\"margin:0;font-size:20px;font-weight:700\">Llegada a Cangas de Onís<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.6;color:#a9c2ba\">Paseo por el Puente Romano y cena con cachopo y sidra. Nos alojamos en [HOTEL].<\u002Fp>\n<\u002Fdiv>\n<div class=\"rv card\" style=\"flex:1 1 240px;display:flex;flex-direction:column;gap:12px;padding:28px;border-radius:20px;background:#12302c;border:1px solid #1f4a44\">\n<div class=\"serif\" style=\"font-size:64px;line-height:1;font-weight:700;color:#f2b15c\">02<\u002Fdiv>\n<h3 style=\"margin:0;font-size:20px;font-weight:700\">Lagos de Covadonga<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.6;color:#a9c2ba\">Amanecer en el Enol, ruta hasta el Ercina y tarde en la Basílica y la Santa Cueva.<\u002Fp>\n<\u002Fdiv>\n<div class=\"rv card\" style=\"flex:1 1 240px;display:flex;flex-direction:column;gap:12px;padding:28px;border-radius:20px;background:#12302c;border:1px solid #1f4a44\">\n<div class=\"serif\" style=\"font-size:64px;line-height:1;font-weight:700;color:#f2b15c\">03<\u002Fdiv>\n<h3 style=\"margin:0;font-size:20px;font-weight:700\">Costa verde<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.6;color:#a9c2ba\">Ribadesella y Lastres, pueblos de postal frente al Cantábrico.<\u002Fp>\n<\u002Fdiv>\n<div class=\"rv card\" style=\"flex:1 1 240px;display:flex;flex-direction:column;gap:12px;padding:28px;border-radius:20px;background:#12302c;border:1px solid #1f4a44\">\n<div class=\"serif\" style=\"font-size:64px;line-height:1;font-weight:700;color:#f2b15c\">04<\u002Fdiv>\n<h3 style=\"margin:0;font-size:20px;font-weight:700\">Último capricho<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.6;color:#a9c2ba\">[TU PLAN SORPRESA] antes de volver a casa con la maleta llena de recuerdos.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:90px 24px;background:#0b1a18\">\n<div style=\"max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:44px\">\n<div class=\"rv\" style=\"display:flex;flex-direction:column;gap:14px;max-width:640px\">\n<p style=\"margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#f2b15c\">Para llenar el estómago<\u002Fp>\n<h2 class=\"serif\" style=\"margin:0;font-size:clamp(32px,4.6vw,56px);line-height:1.05;font-weight:500\">Se come muy bien allí<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n<div class=\"rv card\" style=\"flex:1 1 220px;padding:26px;border-radius:18px;background:#12302c;border:1px solid #1f4a44\"><h3 class=\"serif\" style=\"margin:0 0 8px;font-size:26px;font-weight:500;color:#f2b15c\">Sidra<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.6;color:#a9c2ba\">Escanciada desde bien arriba, como manda la tradición.<\u002Fp><\u002Fdiv>\n<div class=\"rv card\" style=\"flex:1 1 220px;padding:26px;border-radius:18px;background:#12302c;border:1px solid #1f4a44\"><h3 class=\"serif\" style=\"margin:0 0 8px;font-size:26px;font-weight:500;color:#f2b15c\">Fabada<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.6;color:#a9c2ba\">El plato de cuchara que te reconcilia con el frío.<\u002Fp><\u002Fdiv>\n<div class=\"rv card\" style=\"flex:1 1 220px;padding:26px;border-radius:18px;background:#12302c;border:1px solid #1f4a44\"><h3 class=\"serif\" style=\"margin:0 0 8px;font-size:26px;font-weight:500;color:#f2b15c\">Cabrales<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.6;color:#a9c2ba\">Queso azul con carácter, nacido en los Picos de Europa.<\u002Fp><\u002Fdiv>\n<div class=\"rv card\" style=\"flex:1 1 220px;padding:26px;border-radius:18px;background:#12302c;border:1px solid #1f4a44\"><h3 class=\"serif\" style=\"margin:0 0 8px;font-size:26px;font-weight:500;color:#f2b15c\">Cachopo<\u002Fh3><p style=\"margin:0;font-size:16px;line-height:1.6;color:#a9c2ba\">Dos filetes rellenos y empanados. Se pide para compartir.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"position:relative;padding:130px 24px 110px;overflow:hidden;background:radial-gradient(ellipse at 50% 110%,#2a5a50 0%,#0b1a18 65%)\">\n<div style=\"position:relative;max-width:820px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:30px\">\n<svg class=\"hs\" width=\"64\" height=\"64\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3 5.5 6.3 5.5c2 0 3.9 1.2 5.7 3.3 1.8-2.1 3.7-3.3 5.7-3.3 3.3 0 5.1 3.1 3.8 6.3C19.5 16.4 12 21 12 21z\" fill=\"#f27c92\"><\u002Fpath><\u002Fsvg>\n<h2 class=\"serif rv\" style=\"margin:0;font-size:clamp(40px,7vw,92px);line-height:1;font-weight:700;color:#fff\">¿Te vienes conmigo, Victoria?<\u002Fh2>\n<p style=\"margin:0;font-size:19px;line-height:1.6;color:#a9c2ba;max-width:520px\">Ya tengo la ruta, el sitio donde dormir y las ganas. Solo me falta tu respuesta.<\u002Fp>\n<sc-if value=\"{{ notYes }}\" hint-placeholder-val=\"{{ true }}\">\n<button class=\"cta\" sc-camel-on-click=\"{{ sayYes }}\" style=\"min-height:58px;padding:0 40px;border:0;border-radius:999px;background:#f2b15c;color:#1a1208;font-family:'Manrope',system-ui,sans-serif;font-size:18px;font-weight:700;cursor:pointer\">Sí, nos vamos<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ yes }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:fadeUp 1s ease both;display:flex;flex-direction:column;gap:10px;align-items:center\">\n<p class=\"serif\" style=\"margin:0;font-size:clamp(26px,4vw,44px);font-weight:500;color:#f2b15c\">Sabía que dirías que sí.<\u002Fp>\n<p style=\"margin:0;font-size:18px;color:#e8f0ec\">Nos vemos en Asturias.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<p style=\"margin:40px 0 0;font-size:15px;color:#a9c2ba\">Con todo mi cariño<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:4700}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { revealed: false, yes: false };\n  }\n  renderVals() {\n    return {\n      revealed: this.state.revealed,\n      notRevealed: !this.state.revealed,\n      yes: this.state.yes,\n      notYes: !this.state.yes,\n      reveal: () => this.setState({ revealed: true }),\n      sayYes: () => this.setState({ yes: true })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
